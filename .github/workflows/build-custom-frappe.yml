# Build custom Frappe image with apps from apps.json and push to GHCR.
# Coolify only pulls this image — do not build on the Coolify server.
#
# Important for fast deploys: keep Docker layer cache. A no-cache rebuild
# produces a new ~800MB layer every time, which Coolify must download+extract
# while the old containers are already stopped (long downtime).

name: Build Custom Frappe Image

on:
  push:
    branches: [main, master]
    paths:
      - "apps.json"
      - "images/**"
      - ".github/workflows/build-custom-frappe.yml"
  repository_dispatch:
    types: [rebuild-image]
  workflow_dispatch:
    inputs:
      cache_bust:
        description: >-
          Extra bench-init cache bust (pass LMS commit SHA when triggered
          from institute-lms so app code is re-fetched from git).
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sip-travel/frappe-custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Bust bench-init when apps.json changes OR when an external trigger
      # passes cache_bust (institute-lms push). Without the latter, Docker GHA
      # cache reuses a stale bench-init layer and LMS changes never reach GHCR.
      - name: Compute apps cache key
        id: apps
        env:
          EXTRA_CACHE_BUST: >-
            ${{ github.event.inputs.cache_bust
                || github.event.client_payload.cache_bust
                || '' }}
        run: |
          base="$(sha256sum apps.json | cut -c1-16)"
          if [ -n "${EXTRA_CACHE_BUST}" ]; then
            bust="${base}-${EXTRA_CACHE_BUST}"
          else
            # apps.json hash only — reuse bench-init layer when app list is unchanged.
            bust="${base}"
          fi
          echo "cache_bust=${bust}" >> "$GITHUB_OUTPUT"
          echo "Using CACHE_BUST=${bust}"

      - name: Generate private apps manifest
        env:
          APP_GIT_USERNAME: ${{ secrets.APP_GIT_USERNAME }}
          APP_GIT_TOKEN: ${{ secrets.APP_GIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_GIT_USERNAME}" ] || [ -z "${APP_GIT_TOKEN}" ]; then
            echo "ERROR: APP_GIT_USERNAME and APP_GIT_TOKEN secrets must be set on this repo."
            echo "They are required to clone SIP-Travel/institute-lms during bench init."
            echo "Tip: set APP_GIT_USERNAME to x-access-token and APP_GIT_TOKEN to your PAT."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          username = quote(os.environ["APP_GIT_USERNAME"], safe="")
          token = quote(os.environ["APP_GIT_TOKEN"], safe="")

          def private_repo(repository: str) -> str:
              return (
                  f"https://{username}:{token}"
                  f"@github.com/{repository}.git"
              )

          for repository in ("SIP-Travel/institute-lms",):
              print(f"Checking access to {repository}...")
              subprocess.run(
                  ["git", "ls-remote", private_repo(repository), "HEAD"],
                  check=True,
              )

          apps = [
              {
                  "url": "https://github.com/frappe/erpnext",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/frappe/hrms",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/frappe/payments",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/agritheory/cloud_storage",
                  "branch": "version-16",
              },
              {
                  "url": private_repo("SIP-Travel/institute-lms"),
                  "branch": "main",
              },
          ]

          output = Path(os.environ["RUNNER_TEMP"]) / "apps.json"
          output.write_text(json.dumps(apps, indent=2), encoding="utf-8")
          output.chmod(0o600)
          PY

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          platforms: linux/amd64
          push: true
          # Reuse layers across builds so Coolify usually only pulls a small delta.
          # Do NOT use no-cache — that forces an ~800MB re-pull on every Coolify deploy.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_IMAGE_PREFIX=frappe
            CACHE_BUST=${{ steps.apps.outputs.cache_bust }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:version-16
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:version-16-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
