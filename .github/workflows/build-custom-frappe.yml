# Build custom Frappe image with apps from apps.json and push to GHCR.
# Coolify only pulls this image — do not build on the Coolify server.
#
# Important for fast deploys: keep Docker layer cache. A no-cache rebuild
# produces a new ~800MB layer every time, which Coolify must download+extract
# while the old containers are already stopped (long downtime).

name: Build Custom Frappe Image

on:
  push:
    branches: [main, master]
    paths:
      - "apps.json"
      - "images/**"
      - ".github/workflows/build-custom-frappe.yml"
  repository_dispatch:
    types: [rebuild-image]
  workflow_dispatch:
    inputs:
      cache_bust:
        description: >-
          Extra bench-init cache bust (pass LMS commit SHA when triggered
          from institute-lms so app code is re-fetched from git).
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sip-travel/frappe-custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4

      # Bust bench-init when apps.json changes OR when an external trigger
      # passes cache_bust (institute-lms push). Without the latter, Docker GHA
      # cache reuses a stale bench-init layer and LMS changes never reach GHCR.
      - name: Compute apps cache key
        id: apps
        env:
          EXTRA_CACHE_BUST: >-
            ${{ github.event.inputs.cache_bust
                || github.event.client_payload.cache_bust
                || '' }}
        run: |
          base="$(sha256sum apps.json | cut -c1-16)"
          if [ -n "${EXTRA_CACHE_BUST}" ]; then
            bust="${base}-${EXTRA_CACHE_BUST}"
          else
            # apps.json hash only — reuse bench-init layer when app list is unchanged.
            bust="${base}"
          fi
          echo "cache_bust=${bust}" >> "$GITHUB_OUTPUT"
          echo "Using CACHE_BUST=${bust}"

      - name: Resolve institute-lms ref
        id: lms
        env:
          CACHE_BUST: >-
            ${{ github.event.inputs.cache_bust
                || github.event.client_payload.cache_bust
                || '' }}
        run: |
          if [ -n "${CACHE_BUST}" ]; then
            echo "ref=${CACHE_BUST}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          echo "Checking out institute-lms at ref: $(cat "$GITHUB_OUTPUT" | grep '^ref=' | cut -d= -f2-)"

      - name: Checkout institute-lms
        uses: actions/checkout@v4
        with:
          repository: SIP-Travel/institute-lms
          ref: ${{ steps.lms.outputs.ref }}
          token: ${{ secrets.APP_GIT_TOKEN }}
          path: .build/institute-lms
          fetch-depth: 1

      # bench get-app clones with --branch from apps.json. A SHA checkout is
      # detached HEAD with no local "main", so create/reset main at HEAD.
      - name: Point local main at checked-out LMS commit
        run: |
          set -euo pipefail
          git -C .build/institute-lms checkout -B main
          git -C .build/institute-lms rev-parse --abbrev-ref HEAD
          git -C .build/institute-lms rev-parse HEAD
          git -C .build/institute-lms show-ref --verify refs/heads/main

      - name: Generate apps manifest
        run: |
          set -euo pipefail
          if [ ! -d .build/institute-lms/.git ]; then
            echo "ERROR: institute-lms checkout is missing under .build/institute-lms"
            exit 1
          fi
          if ! git -C .build/institute-lms show-ref --verify --quiet refs/heads/main; then
            echo "ERROR: .build/institute-lms has no local main branch for file:// clone"
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          apps = [
              {
                  "url": "https://github.com/frappe/erpnext",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/frappe/hrms",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/frappe/payments",
                  "branch": "version-16",
              },
              {
                  "url": "https://github.com/agritheory/cloud_storage",
                  "branch": "version-16",
              },
              {
                  # Checked out in CI — no git credentials inside the Docker build.
                  "url": "file:///opt/frappe/institute-lms",
                  "branch": "main",
              },
          ]

          output = Path(os.environ["RUNNER_TEMP"]) / "apps.json"
          output.write_text(json.dumps(apps, indent=2), encoding="utf-8")
          output.chmod(0o600)
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          platforms: linux/amd64
          push: true
          # Reuse layers across builds so Coolify usually only pulls a small delta.
          # Do NOT use no-cache — that forces an ~800MB re-pull on every Coolify deploy.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secret-files: |
            apps_json=${{ runner.temp }}/apps.json
          build-args: |
            FRAPPE_BRANCH=version-16
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_IMAGE_PREFIX=frappe
            CACHE_BUST=${{ steps.apps.outputs.cache_bust }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:version-16
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:version-16-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
