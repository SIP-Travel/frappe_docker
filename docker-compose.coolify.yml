# Coolify downtime notes:
# Compose has no rolling updates — Coolify stops containers, then recreates.
# Long downtime = image pull/extract after stop. Fix that by pre-pulling on the
# host *before* Coolify deploy (CI: .github/workflows/deploy-coolify.yml).
# Do NOT use Coolify "Pre Deployment Command" for docker pull (runs in-container
# and fails on multi-service compose).
# Residual downtime (~container restart + healthchecks + migrate) remains.
#
# GitHub secret COOLIFY_COMPOSE_DIR = Coolify service path on the host
# (e.g. /data/coolify/services/<uuid>) so deploy CI can run compose pull.
# Coolify webhooks do not pull latest images by default.
#
x-erpnext-image: &erpnext_image
  image: ${FRAPPE_CUSTOM_IMAGE:-ghcr.io/sip-travel/frappe-custom:version-16}
  platform: linux/amd64
  pull_policy: always
  restart: unless-stopped

x-backend-defaults: &backend_defaults
  <<: *erpnext_image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

# Backend ready = can serve API. Do not wait for migrate (setup-lms-site).
x-backend-healthcheck: &backend_healthcheck
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "curl -fsS -H 'Host: erp.sipcorp.id' -H 'X-Frappe-Site-Name: erp.sipcorp.id' http://127.0.0.1:8000/api/method/ping",
      ]
    interval: 5s
    timeout: 5s
    retries: 24
    start_period: 30s

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_AUTO_UPGRADE: "1"

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped

    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *erpnext_image
    restart: "no"
    exclude_from_hc: true

    entrypoint:
      - bash
      - -c

    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host "$$DB_HOST";
        bench set-config -gp db_port "$$DB_PORT";
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port "$$SOCKETIO_PORT";
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;

    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"

    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    <<: *erpnext_image
    restart: "no"
    exclude_from_hc: true

    entrypoint:
      - bash
      - -c

    command:
      - |
        set -e

        wait-for-it -t 180 db:3306
        wait-for-it -t 180 redis-cache:6379
        wait-for-it -t 180 redis-queue:6379

        until [ -f sites/common_site_config.json ]; do
          echo "Waiting for common_site_config.json"
          sleep 5
        done

        echo "common_site_config.json found"

        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists; skipping creation"
        else
          bench new-site \
            --mariadb-user-host-login-scope='%' \
            --admin-password "$$ADMIN_PASSWORD" \
            --db-root-username root \
            --db-root-password "$$DB_PASSWORD" \
            --install-app erpnext \
            --set-default \
            "$$SITE_NAME"

          bench --site "$$SITE_NAME" \
            set-config host_name "https://$$SITE_NAME"
        fi

    environment:
      SITE_NAME: "erp.sipcorp.id"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?}
      DB_PASSWORD: ${DB_PASSWORD:?}

    depends_on:
      configurator:
        condition: service_completed_successfully

    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  backend:
    <<: [*backend_defaults, *backend_healthcheck]

    environment:
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}

  frontend:
    <<: *erpnext_image

    command:
      - nginx-entrypoint.sh

    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000

      # Use a fixed site name instead of the nginx $host variable.
      # This also prevents Coolify from creating an unwanted "$host"
      # environment variable.

      UPSTREAM_REAL_IP_ADDRESS: 0.0.0.0/0
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "on"

      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Host: erp.sipcorp.id' http://127.0.0.1:8080/",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s

    # Bring nginx up as soon as backend can answer /api/method/ping.
    # Do NOT wait for setup-lms-site (migrate) — that is the main avoidable
    # downtime after the image is already pulled.
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_started
      create-site:
        condition: service_completed_successfully

    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  websocket:
    <<: *backend_defaults

    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js

  queue-short:
    <<: *backend_defaults

    command:
      - bench
      - worker
      - --queue
      - short,default

  queue-long:
    <<: *backend_defaults

    command:
      - bench
      - worker
      - --queue
      - long,default,short

  scheduler:
    <<: *backend_defaults

    command:
      - bench
      - schedule
  
  setup-lms-site:
    <<: *erpnext_image
    restart: "no"
    exclude_from_hc: true

    entrypoint:
      - bash
      - -lc

    environment:
      LMS_SITE_NAME: "lms.sipinstitute.id"
      LMS_ADMIN_PASSWORD: ${LMS_ADMIN_PASSWORD:?}
      DB_PASSWORD: ${DB_PASSWORD:?}

    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
      create-site:
        condition: service_completed_successfully
      # Migrate after backend is up so the site can serve while this runs.
      backend:
        condition: service_healthy

    command:
      - |
        set -euo pipefail

        trap 'rc=$$?; echo "ERROR: setup-lms-site failed at line $${LINENO}, exit code $${rc}"; exit "$${rc}"' ERR

        cd /home/frappe/frappe-bench

        wait-for-it -t 180 db:3306
        wait-for-it -t 180 redis-cache:6379
        wait-for-it -t 180 redis-queue:6379

        until [ -f sites/common_site_config.json ]; do
          echo "Waiting for common_site_config.json..."
          sleep 5
        done

        echo "common_site_config.json found"
        echo "Checking application code in image..."

        for required_app in payments lms; do
          if [ ! -d "apps/$${required_app}" ]; then
            echo "ERROR: apps/$${required_app} is missing."
            echo "Applications available in image:"
            ls -1 apps
            exit 1
          fi

          echo "Found apps/$${required_app}"
        done

        echo "Applications registered in sites/apps.txt:"
        cat sites/apps.txt

        if ! grep -Fxq "payments" sites/apps.txt; then
          echo "ERROR: payments is not registered in sites/apps.txt"
          exit 1
        fi

        if ! grep -Fxq "lms" sites/apps.txt; then
          echo "ERROR: lms is not registered in sites/apps.txt"
          exit 1
        fi

        if [ ! -f "sites/$${LMS_SITE_NAME}/site_config.json" ]; then
          echo "Creating LMS site: $${LMS_SITE_NAME}"

          bench new-site "$${LMS_SITE_NAME}" \
            --mariadb-user-host-login-scope='%' \
            --db-root-username root \
            --db-root-password "$${DB_PASSWORD}" \
            --admin-password "$${LMS_ADMIN_PASSWORD}"

          echo "Site created successfully"
        else
          echo "Site already exists: $${LMS_SITE_NAME}"
        fi

        echo "Reading currently installed applications..."

        if ! installed_apps="$$(bench \
          --site "$${LMS_SITE_NAME}" \
          list-apps 2>&1)"; then

          echo "ERROR: unable to read installed applications:"
          echo "$${installed_apps}"
          exit 1
        fi

        echo "Currently installed applications:"
        echo "$${installed_apps}"

        if grep -Eq '(^|[[:space:]])lms([[:space:]]|$$)' \
          <<< "$${installed_apps}"; then

          echo "lms is already installed"
        else
          echo "Installing customized LMS..."

          # LMS will use the customized dependency from apps/payments.
          bench \
            --site "$${LMS_SITE_NAME}" \
            install-app lms

          echo "LMS installed successfully"
        fi

        bench \
          --site "$${LMS_SITE_NAME}" \
          set-config host_name "https://$${LMS_SITE_NAME}"

        echo "Running migrations (site already serving traffic)..."

        bench --site "$${LMS_SITE_NAME}" migrate
        bench --site "$${LMS_SITE_NAME}" clear-cache
        bench --site "$${LMS_SITE_NAME}" clear-website-cache

        echo "Final installed applications:"
        bench --site "$${LMS_SITE_NAME}" list-apps

        echo "LMS setup completed successfully"

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:
